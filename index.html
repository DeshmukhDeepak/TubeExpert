<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcf5f500;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            /* position: absolute; */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 1179px;
            height: 330px;
            /* transform: translate(-50%, -50%); */
            margin: 200px  auto 0px;
            background: rgb(252, 236, 239);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .ht {
            color: #ef2b2b;
            font-size: 48px;
            margin-bottom: 0px;
        }
        p {
            color: #555;
            font-size: 20px;
        }
        .input-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border: 2px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin: 50px auto;
            width: 812px;
        }
        input[type="text"] {
            border: none;
            outline: none;
            flex: 1;
            padding: 8px;
            font-size: 16px;
        }
        button {
            background-color: #ef2f2f;
            color: white;
            border: none;
            padding: 10px 20px; 
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #b70202;
        }
        .footer-text {
            margin-top: 10px;
            font-size: 14px;
            color: #777;
        }
        .footer-text a {
            color: #7e57c2;
            text-decoration: none;
        }

        .cp {

            width: 678px;
            padding: 2%;
            margin: auto;
            font-size: 20px;

        }

        .ytd {

            height: 400px;
            padding: 50px;

        }

        .ytd h1 {

            font-size: 36px;
            color: #1d1d25;

        }

        .imgg {

            height: 250px;

        }

        .howto {

            display:flex;
            padding: 10px;
            background: #ffffff;
            justify-content: center;
            justify-content: space-evenly;
            margin-top: 60px;
        }

        .howto p {

            font-size: 25px;
            font-weight: 600;
            margin-top: 50px;
            color: #1d1d25;
            margin: 20px auto 0px;
        }

        footer {

            height: 200px;

        }

    </style>
</head>
<body>
    <div class="container">
        <h1 class="ht">YouTube Video Downloader</h1>
        <p class="cp" >Download any public video from YouTube, transcribe it to text, extract or add subtitles!</p>
        <div class="input-box">
            <input type="text" placeholder="Paste a YouTube video URL here">
            <button>Download</button>
        </div>
    </div>

    <div class="ytd">

        <h1>How to Download YouTube video ?</h1>

        <div class="howto">

            <div class="one">
                <img src="hyt1.webp" alt="" class="imgg">

                <p>Copy and Paste the Youtube URL</p>

            </div>

            <div class="two">
                <img src="hyt2.webp" alt="" class="imgg">
                <p>Click Download</p>
            </div>

        </div>

        

    </div>

    <footer >


    </footer>

</body>
</html>
